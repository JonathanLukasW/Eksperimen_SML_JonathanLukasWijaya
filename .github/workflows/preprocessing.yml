name: CS:GO Preprocessing

on:
  push:
    branches:
      - main

jobs:
  preprocess:
    name: Run EDA & Preprocessing
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.12.9
      - name: Set up Python 3.12.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn seaborn matplotlib

      # 4. Run preprocessing script
      - name: Run preprocessing script
        run: python preprocessing/automate_Jonathan.py

      # 5. Verify output artifacts exist
      - name: Verify preprocessing artifacts
        run: |
          test -f preprocessing/csgo_preprocessed/train_clean.csv && \
          test -f preprocessing/csgo_preprocessed/test_clean.csv && \
          echo "Preprocessing artifacts verified." || exit 1
